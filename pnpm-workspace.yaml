packages:
  - apps/*
  - packages/*
  - tooling
catalogMode: prefer
catalog:
  "@better-auth/drizzle-adapter": "1.7.23"
  "@better-auth/infra": ^0.4.30
  "@better-auth/passkey": "1.7.23"
  "@cloudflare/workers-types": ^5.20261113.1
  "@orpc/client": ^1.16.2
  "@orpc/server": ^1.16.2
  "@types/node": ^26.6.6
  "@types/pg": "^8.23.1"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@uiw/color-convert": "^2.10.3"
  "ai": ^7.0.172
  "bcryptjs": "^3.0.3"
  "better-auth": "1.7.23"
  "drizzle-orm": "1.0.0-rc.4"
  "es-toolkit": ^1.53.2
  esbuild: ^0.28.2
  "fflate": "^0.8.3"
  "ioredis": "^6.0.0"
  "jsonrepair": "^3.15.0"
  "pg": "^8.23.1"
  # One React copy for the web app and the shared packages that render with it.
  "react": "19.3.1"
  "ts-pattern": ^5.9.2
  "typescript": "^7.0.2"
  "tsrs": "0.25.0-ts7.1.0-beta"
  "vite-plus": 1.6.0
  wrangler: ^4.162.0
  "zod": ^4.6.7
  "@fontsource-variable/figtree": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@fontsource/instrument-serif": ^5.3.0
  "@shadcn/react": ^0.3.1
  isbot: ^5.2.3
  "@resvg/resvg-wasm": ^2.6.2
  htmlparser2: 12.0.0
  mdast-util-from-markdown: 2.1.0
  "@reactive-resume/utils": workspace:*
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  pdf-lib: 1.17.1
allowBuilds:
  # Reached from the Expo support inside @better-auth/infra (expo-constants → expo → jest-haste-map);
  # its prebuilt binary needs no build script.
  "@parcel/watcher": false
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
minimumReleaseAge: 0
overrides:
  # Keep Better Auth and its plugins on one core peer graph after infra's utils update.
  "@better-auth/utils": 0.5.1
  next@<16.3.8: 16.3.8
  postcss-selector-parser@<7.1.6: ^7.1.6
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  postcss@<8.5.10: ^8.5.14
  samlify@<2.13.0: ^2.13.0
  uuid@<11.1.1: ^11.1.1
  dompurify@<3.4.17: ^3.4.17
  node-forge@<1.4.1: ^1.4.2
  zod@>=4.0.0 <4.6.6: ^4.6.7
  # Keep plugin imports on the same Vite and Vitest instances as Vite+.
  vite@*: "catalog:"
  vitest@*: "catalog:"
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
skills:
  dirs:
    - .agents/skills
permissions:
  "@tanstack/devtools-vite":
    skills: true
  "@tanstack/react-hotkeys":
    skills: true
  "@tanstack/react-router":
    skills: true
  "@tanstack/router-plugin":
    skills: true
  drizzle-kit:
    skills: true
  expo-sqlite:
    skills: true
  tsdown:
    skills: true
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
